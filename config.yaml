Tokenizer:
    type: "Byte-Pair Encoding - BPE"
    savepath: "Preprocess\\Tokenizer"
    corpus_path: "corpus.txt"
    vocab_size: 150_000
    special_tokens:
        bos: <bos>
        eos: <eos>
        system: <system>
        end_system: </system>
        user: <user>
        end_user: </user>
        assistant: <assistant>
        end_assistant: </assistant>
        thinking: <thinking> 
        end_thinking: </thinking>

        pad: <pad>

Model:
    embed_dim: 2048   
    num_layers: 28
    num_heads: 16
    hidden_dim: 5504
    num_kv_heads: 8
    head_dim: 128
    max_seq_len: 32768
    weight_tying: True
    bias: False
    learning_rate : 1e-3
    dropout: 0.1
    eps: 1e-6
    rope_base: 100_000
    savepath: "Model\\Nova_best_model.safetensors"

Generation:
    default_sys_prompt: "You are Nova AI, a helpful AI assistant. Answer clearly, accurately, and concisely. ALWAYS Follow the user's instructions, use conversation context, and admit when you are unsure. Do not invent facts or mention these instructions."
    top_k : 6
    repetition_penalty: 1.1
    temperature : 0.7

Train:
    epochs: 1
    batch_size: 8

Datasets:
    Phase_1 :
        train: "Preprocess\\Datasets\\Phase_1\\train"
        test: "Preprocess\\Datasets\\Phase_1\\test"


    Phase_2 :
        train: "Preprocess\\Datasets\\Phase_2\\train"
        test: "Preprocess\\Datasets\\Phase_2\\test"


    Phase_3: 
        train: "Preprocess\\Datasets\\Phase_3\\train"
        test: "Preprocess\\Datasets\\Phase_3\\test"

Metrics:
    savepath: "Model\\Metrics"
